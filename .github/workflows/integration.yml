# Deterministic unit + integration tests. Stress is not part of this workflow.
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxss-dev \
            libgl-dev \
            pkg-config \
            xvfb \
            xauth \
            libgl1-mesa-dri

      - name: Build pinned SDL3 prefix
        env:
          SDL3_PREFIX: ${{ github.workspace }}/.cache/sdl3-prefix
          JOBS: 2
        run: |
          set -euo pipefail
          chmod +x scripts/build_sdl3_prefix.sh
          scripts/build_sdl3_prefix.sh "${SDL3_PREFIX}"
          echo "SDL3_PREFIX=${SDL3_PREFIX}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${SDL3_PREFIX}/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${SDL3_PREFIX}/lib" >> "${GITHUB_ENV}"

      - name: Environment
        run: |
          uname -s -m
          g++ --version | head -1
          ffmpeg -version | head -1
          pkg-config --modversion sdl3
          pkg-config --modversion sdl3-ttf
          command -v timeout

      - name: Build
        run: make USE_PKG_CONFIG=1 SDL3_PREFIX="${SDL3_PREFIX}" -j"$(nproc)"

      - name: Unit tests
        run: make USE_PKG_CONFIG=1 SDL3_PREFIX="${SDL3_PREFIX}" check

      - name: Accelerated progress rendering equivalence (Mesa OpenGL)
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' ./tests/test_progress_dots --accelerated
          SDL_RENDER_LINE_METHOD=2 xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' ./tests/test_progress_dots --accelerated

      - name: Integration tests
        run: make USE_PKG_CONFIG=1 SDL3_PREFIX="${SDL3_PREFIX}" integration

  integration-macos:
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies via Homebrew
        run: |
          brew install ffmpeg sdl3 sdl3_ttf pkg-config

      - name: Environment
        run: |
          uname -s -m
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX:-}"
          g++ --version | head -1
          ffmpeg -version | head -1
          pkg-config --modversion sdl3
          pkg-config --modversion sdl3-ttf
          command -v timeout || echo "timeout not installed (optional)"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: make check

      - name: Integration tests
        run: make integration

  integration-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make coreutils
          pacboy: >-
            gcc:p
            make:p
            ffmpeg:p
            sdl3:p
            sdl3-ttf:p
            pkgconf:p

      - name: Environment
        shell: msys2 {0}
        run: |
          set -euo pipefail
          uname -s -m
          echo "MSYSTEM=${MSYSTEM}"
          g++ --version | head -1
          ffmpeg -version | head -1
          pkg-config --modversion sdl3
          pkg-config --modversion sdl3-ttf
          command -v timeout
          timeout --version | head -1
          command -v make
          command -v ffmpeg
          command -v g++

      - name: Build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Unit tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make check

      - name: Integration tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make integration
